<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixNow | Dark Evolution 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="bg-mesh"></div>
    <div id="app">
      <!-- High-Depth Floating Tools -->
      <img src="/assets/hammer.png" class="floating-tool tool-hammer" alt="Hammer">
      <img src="/assets/wrench.png" class="floating-tool tool-wrench" alt="Wrench">
      <img src="/assets/drill.png" class="floating-tool tool-drill" alt="Drill">
      <img src="/assets/screwdriver.png" class="floating-tool tool-screwdriver" alt="Screwdriver">
      <img src="/assets/plunger.png" class="floating-tool tool-plunger" alt="Plunger">

      <header class="hero">
        <div class="hero-content">
          <h1 class="logo">FixNow</h1>
          <p class="tagline">Find Trusted Service Workers Instantly</p>
          <div class="cta-group">
            <button class="btn btn-primary">Launch App</button>
            <button class="btn btn-secondary">Find Workers</button>
          </div>
        </div>
      </header>

      <!-- Midnight Obsidian Mobile Shell -->
      <div class="mobile-shell">
        <div class="app-screen">
          <!-- Premium Splash Screen -->
          <div class="splash">
            <h1 class="logo splash-logo">FixNow</h1>
            <div class="loading-bar-container">
              <div class="loading-bar"></div>
            </div>
          </div>

          <!-- Main Dashboard Experience -->
          <div class="main-content">
            <header class="app-header">
              <div class="location">
                <p>Your Location</p>
                <h3>Brooklyn, NY</h3>
              </div>
              <div class="avatar"></div>
            </header>

            <div class="search-container">
              <div class="search-bar-3d">
                <i data-lucide="search" style="margin-left: 12px; color: #64748b;"></i>
                <input type="text" placeholder="Search services...">
              </div>
            </div>

            <section class="categories">
              <div class="section-title">
                <h4>Categories</h4>
                <a href="#">See all</a>
              </div>
              <div class="category-grid">
                <div class="category-card">
                  <img src="/assets/hammer.png" width="45" alt="">
                  <span style="font-size: 0.9rem; font-weight: 500;">Cleaning</span>
                </div>
                <div class="category-card">
                  <img src="/assets/wrench.png" width="45" alt="">
                  <span style="font-size: 0.9rem; font-weight: 500;">Repairs</span>
                </div>
                <div class="category-card">
                  <img src="/assets/drill.png" width="45" alt="">
                  <span style="font-size: 0.9rem; font-weight: 500;">Electrical</span>
                </div>
                <div class="category-card">
                  <img src="/assets/plunger.png" width="45" alt="">
                  <span style="font-size: 0.9rem; font-weight: 500;">Plumbing</span>
                </div>
              </div>
            </section>

            <section class="workers-section">
              <div class="section-title">
                <h4>Recommended</h4>
                <a href="#">View All</a>
              </div>
              <div class="worker-scroll">
                <!-- GSAP Injected Cards -->
              </div>
            </section>

            <!-- Neo-Glass Bottom Nav -->
            <nav class="bottom-nav">
              <div class="nav-item active"><i data-lucide="home"></i></div>
              <div class="nav-item"><i data-lucide="briefcase"></i></div>
              <div class="nav-item post-btn"><i data-lucide="plus-circle" style="width: 28px; height: 28px;"></i></div>
              <div class="nav-item"><i data-lucide="message-square"></i></div>
              <div class="nav-item"><i data-lucide="user"></i></div>
            </nav>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
